# ─── Date Constants ───────────────────────────────────────────────────────────
dates:
  data_start: "2005-01-07"
  data_end:   "2026-04-10"
  total_weeks: 1110
  dev_end:     "2024-04-12"       # last dev Friday
  holdout_start: "2024-04-19"     # first holdout Friday
  holdout_weeks: 104              # ~2 years

# ─── Return Convention ───────────────────────────────────────────────────────
returns:
  convention: "gross[t] = w[t] @ etf_rets[t+1]"
  calculation: "pct_change"
  frequency: "weekly"
  execution_delay_weeks: 1
  annualization_factor: 52
  sharpe_annualization: 7.2111  # sqrt(52)

# ─── Transaction Cost Model ──────────────────────────────────────────────────
costs:
  cost_per_unit_turnover: 0.001   # 10 bps per half-round-trip
  turnover_convention: "sum(abs(w[t] - drift)) / 2 per week"
  net_return: "gross[t] - turnover[t] * 0.001"

# ─── Benchmark Configuration ─────────────────────────────────────────────────
benchmarks:
  primary: "SPY"
  secondary: "AGG"
  blend_6040: true

# ─── Regime States ───────────────────────────────────────────────────────────
# Production states (must be preserved or superseded by native states)
production_states:
  - "neutral_mixed"        # 493 weeks, 44.4%
  - "calm_trend"           # 295 weeks, 26.6%
  - "stressed_panic"       # 229 weeks, 20.6%
  - "recovery_fragile"     #  49 weeks,  4.4%
  - "recovery_confirmed"   #  44 weeks,  4.0%

# Native NM sub-states (Path B additions — subject to Sprint 2 observation check)
native_nm_substates:
  - "neutral_soft_landing"  # NM + slowdown + FC_benign
  - "neutral_macro_stress"  # NM + macro_stress or FC_tight
  - "neutral_overheating"   # NM + overheating or elevated inflation
  - "neutral_chop"          # NM + expansion or unclear macro

# ─── Observation Minimums ────────────────────────────────────────────────────
min_observations:
  per_state_dev: 30         # states with fewer obs must be merged
  ic_window_weeks: 52       # minimum IC estimation window
  ic_fallback: "cross_state_average"  # fallback when obs < 30

# ─── Hysteresis Parameters (to be formalized in Sprint 2) ────────────────────
hysteresis:
  min_activation_weeks: 2   # minimum consecutive weeks before state activation
  min_deactivation_weeks: 2 # minimum consecutive weeks before state deactivation
  confidence_threshold: 0.6 # minimum confidence to trigger transition

# ─── Risk Budget Hard Constraints ────────────────────────────────────────────
risk_constraints:
  stressed_panic:
    max_offense_budget: 0.30
    min_defense_floor: 0.40
  recovery_fragile:
    max_re_risk_speed_per_week: 0.05
  all_states:
    max_single_etf_weight: 0.35
    min_weight: 0.0
    sum_weights: 1.0
    no_leverage: true
    long_only: true

# ─── Shrinkage ────────────────────────────────────────────────────────────────
ic_shrinkage:
  method: "toward_equal_weight"
  shrinkage_factor: 0.5  # to be tuned in Sprint 3 (dev period only)

# ─── Gate Thresholds (also in validation_gates.yaml) ─────────────────────────
promotion_gates:
  G1_dsharpe_min: 0.01
  G2_holdout_dsharpe_min: -0.02
  G6_dturnover_max: 0.03
  G7_nm_sharpe_min_delta: 0.0
  G8_sp_sharpe_min_delta: -0.02
  G9_rf_sharpe_min_delta: -0.02
  max_drawdown_worsening: 0.01   # 1 percentage point
