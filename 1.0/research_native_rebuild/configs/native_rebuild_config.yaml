  feature_panel:      "research_native_rebuild/outputs/feature_panel/"
  regime_engine:      "research_native_rebuild/outputs/regime_engine/"
  signal_weighting:   "research_native_rebuild/outputs/signal_weighting/"
  risk_budgets:       "research_native_rebuild/outputs/risk_budgets/"
  portfolio_backtest: "research_native_rebuild/outputs/portfolio_backtest/"
  comparison:         "research_native_rebuild/outputs/comparison/"

