# Path B — Native Rebuild Global Configuration
# Sprint 0 — 2026-06-07
# SCAFFOLD ONLY. No production files are modified by any script in this project.

# ─── Identity ────────────────────────────────────────────────────────────────
project_name: "path_b_native_rebuild"
sprint: 0
status: "scaffold_only"
created: "2026-06-07"

# ─── Production Pin (benchmark — READ ONLY) ───────────────────────────────────
production_pin:
  name: "improved_frontier_phase5_fragility_guard"
  sharpe_full: 0.9542
  sharpe_holdout: 2.0479
  annual_return: 0.0718
  max_drawdown: -0.1160
  annual_turnover: null  # to be confirmed in Sprint 0.5

# ─── Data Paths (absolute from repo root) ────────────────────────────────────
# All paths below are READ-ONLY for the shadow rebuild.
# Shadow writes ONLY to research_native_rebuild/outputs/.
data_paths:
  # Layer 0 — data hub
  weekly_prices:          "data/01_data_hub/weekly_prices.csv"
  macro_weekly:           "data/01_data_hub/macro_weekly.csv"
  vix_term_structure:     "data/01_data_hub/vix_term_structure.csv"
  google_trends:          "data/01_data_hub/google_trends.csv"
  benchmark_returns:      "data/01_data_hub/benchmark_returns_weekly.csv"

  # Layer 2B — production regime engine artifacts
  market_state_history:   "data/04_layer2b_risk_regime_engine/market_state_history.csv"
  regime_score:           "data/04_layer2b_risk_regime_engine/regime_score.csv"

  # Layer 3 — production portfolio artifacts (for equivalence comparison)
  production_portfolio:   "data/05_layer3_portfolio_construction/"

  # Layer 1 — alpha signals (all REUSE_EXISTING in shadow)
  signals_dir:            "data/02_layer1_signals/"

  # V3 macro states
  macro_states_v3:        "outputs/experiment_results/macro_regime_classifier_v3/macro_states_weekly_v3.csv"

# ─── Shadow Output Paths ──────────────────────────────────────────────────────
# Shadow scripts write ONLY to these directories. Never to data/ or outputs/experiment_results/.
output_paths:
